{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">
                <h2 class="fw-bold mb-4 text-center">
                    <i class="bi bi-compass-fill text-primary me-2"></i>Create New Trek
                </h2>

                {% if form.errors %}
                    <div class="alert alert-danger rounded-3 mb-4">
                        Please correct the errors below and try again.
                    </div>
                {% endif %}

                <form method="post" action="{% url 'create_trek' %}" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="{{ form.title.id_for_label }}" class="form-label fw-semibold">Trek Title</label>
                        {{ form.title }}
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.destination.id_for_label }}" class="form-label fw-semibold">Destination</label>
                        {{ form.destination }}
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.date.id_for_label }}" class="form-label fw-semibold">Expedition Date</label>
                        {{ form.date }}
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.difficulty.id_for_label }}" class="form-label fw-semibold">Difficulty Level</label>
                        {{ form.difficulty }}
                    </div>

                    <div class="mb-4">
                        <label for="{{ form.images.id_for_label }}" class="form-label fw-semibold">Upload Photos (Select up to 3)</label>
                        {{ form.images }}
                        <small class="text-secondary d-block mt-1">{{ form.images.help_text }}</small>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold">
                        <i class="bi bi-check-circle-fill me-1"></i>Publish Trek
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
