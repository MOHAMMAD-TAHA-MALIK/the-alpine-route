{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4">
                <h2 class="fw-bold mb-4 text-center">Set New Password</h2>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        <p class="mb-0"><strong>Please correct the errors below.</strong></p>
                    </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-success w-100 rounded-pill fw-bold">Change Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
