{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4">
                <h2 class="fw-bold mb-4 text-center">Login</h2>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Your username and password didn't match. Please try again.
                    </div>
                {% endif %}

                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold">Login</button>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'password_reset' %}" class="text-decoration-none text-secondary">Forgot your password?</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
