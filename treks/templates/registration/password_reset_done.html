{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 rounded-4 text-center">
            <div class="card-body p-4">
                <h2 class="fw-bold mb-3">Check Your Email</h2>
                <p class="text-muted mb-4">An email has been sent with instructions to reset your password. If you don't receive an email, please check your spam folder.</p>
                <a href="{% url 'login' %}" class="btn btn-outline-primary rounded-pill px-4 fw-bold">Return to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
